<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday!</title>
    <style>
        /* CSS Styling */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f8ff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            flex-direction: column;
            color: #333;
        }

        /* Pokeball (Page 1) */
        #page1 {
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            transition: transform 0.3s ease;
        }
        #page1:hover {
            transform: scale(1.1);
        }
        .pokeball-btn {
            width: 150px;
            height: 150px;
            background: linear-gradient(to bottom, #ff0000 50%, #ffffff 50%);
            border-radius: 50%;
            border: 10px solid #333;
            position: relative;
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .pokeball-btn::before {
            content: '';
            position: absolute;
            width: 100%;
            height: 10px;
            background-color: #333;
            top: 50%;
            transform: translateY(-50%);
        }
        .pokeball-center {
            width: 40px;
            height: 40px;
            background-color: #fff;
            border: 8px solid #333;
            border-radius: 50%;
            position: relative;
            z-index: 10;
        }
        .click-text {
            margin-top: 20px;
            font-size: 1.2rem;
            font-weight: bold;
            color: #555;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0% { opacity: 0.6; }
            50% { opacity: 1; }
            100% { opacity: 0.6; }
        }

        /* Photo Dex (Page 2) */
        #page2 {
            display: none;
            width: 90%;
            max-width: 500px;
            background: #fff;
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            text-align: center;
        }
        h2.dex-title {
            color: #ff3366;
            margin-top: 0;
            border-bottom: 2px dashed #ffb3c6;
            padding-bottom: 10px;
        }
        .photo-frame {
            width: 100%;
            height: 300px;
            background-color: #e9ecef;
            border: 4px solid #adb5bd;
            border-radius: 10px;
            margin-bottom: 20px;
            overflow: hidden;
            position: relative;
        }
        .photo-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block; /* Default empty state */
        }
        .btn-next {
            background-color: #4CAF50;
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 1.1rem;
            border-radius: 25px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
            transition: background-color 0.2s;
        }
        .btn-next:hover {
            background-color: #45a049;
        }

        /* Birthday Card (Page 3) */
        #page3 {
            display: none;
            width: 90%;
            max-width: 600px;
            background: linear-gradient(135deg, #fff9c4, #ffccbc);
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);
            text-align: left;
            position: relative;
        }
        .card-header {
            font-size: 1.5rem;
            font-weight: bold;
            color: #e64a19;
            margin-bottom: 20px;
        }
        .card-content {
            font-size: 1.2rem;
            line-height: 1.6;
            margin-bottom: 30px;
            min-height: 150px; /* Space for message */
        }
        .card-footer {
            font-size: 1.1rem;
            font-style: italic;
            color: #5d4037;
            text-align: right;
        }

        /* Edit Mode UI */
        .edit-btn {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: #333;
            color: white;
            border: none;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            font-size: 1.5rem;
            cursor: pointer;
            z-index: 100;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        .editable {
            outline: 2px dashed #999;
            padding: 5px;
            min-height: 20px;
        }
        .editable:focus {
            outline: 2px solid #2196F3;
            background-color: rgba(255,255,255,0.8);
        }
        .image-input {
            display: none;
            margin-top: 10px;
            width: 100%;
        }

    </style>
</head>
<body>

    <!-- Audio Element (Hidden) -->
    <audio id="bgm" loop>
        <!-- Place a URL to a Pokemon or cute BGM here. Using a placeholder -->
        <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mpeg">
    </audio>

    <!-- Page 1: Pokeball -->
    <div id="page1" onclick="goToPage2()">
        <div class="pokeball-btn">
            <div class="pokeball-center"></div>
        </div>
        <div class="click-text">แตะเพื่อเปิด!</div>
    </div>

    <!-- Page 2: Photo Dex -->
    <div id="page2">
        <h2 class="dex-title">POKEDEX</h2>
        <div class="photo-frame">
            <img id="dex-image" class="photo-img" src="https://via.placeholder.com/400x300?text=Tap+Edit+to+Add+Photo" alt="Memory Photo">
            <input type="file" id="image-upload" class="image-input" accept="image/*" onchange="previewImage(event)">
        </div>
        <button class="btn-next" onclick="goToPage3()">เปิดการ์ด</button>
    </div>

    <!-- Page 3: Birthday Card -->
    <div id="page3">
        <div id="card-to" class="card-header">Dear Boatt</div>
        <div id="card-message" class="card-content">
            สุขสันต์วันเกิดนะ! ขอให้มีความสุขมากๆ คิดสิ่งใดขอให้สมปรารถนา<br>
            ขอให้ปีนี้เป็นปีที่ยอดเยี่ยม มีแต่เรื่องดีๆ เข้ามาในชีวิตนะ
        </div>
        <div id="card-from" class="card-footer">PNJ ❤️</div>
    </div>

    <!-- Edit Button -->
    <button class="edit-btn" onclick="toggleEditMode()">✏️</button>

    <script>
        // State variables
        let currentPage = 1;
        let isEditMode = false;

        // Navigation Functions
        function goToPage2() {
            if (isEditMode) return; // Disable navigation in edit mode
            
            document.getElementById('page1').style.display = 'none';
            document.getElementById('page2').style.display = 'block';
            
            // Try playing audio (iOS requires user interaction first)
            try {
                document.getElementById('bgm').play();
            } catch (e) {
                console.log("Audio play failed, likely blocked by browser policy.");
            }
        }

        function goToPage3() {
            if (isEditMode) return;
            document.getElementById('page2').style.display = 'none';
            document.getElementById('page3').style.display = 'block';
        }

        // Edit Mode Functions
        function toggleEditMode() {
            isEditMode = !isEditMode;
            const elementsToEdit = ['card-to', 'card-message', 'card-from'];
            const imgInput = document.getElementById('image-upload');

            if (isEditMode) {
                // Turn ON edit mode
                document.querySelector('.edit-btn').style.backgroundColor = '#4CAF50'; // Green to indicate active
                
                // Show all pages for easier editing
                document.getElementById('page1').style.display = 'none'; // Hide intro
                document.getElementById('page2').style.display = 'block';
                document.getElementById('page3').style.display = 'block';
                
                // Make text contentEditable
                elementsToEdit.forEach(id => {
                    const el = document.getElementById(id);
                    el.contentEditable = true;
                    el.classList.add('editable');
                });

                // Show image upload input
                imgInput.style.display = 'block';

            } else {
                // Turn OFF edit mode
                document.querySelector('.edit-btn').style.backgroundColor = '#333';
                
                // Reset to current page view logic (simplification: reset to page 1)
                document.getElementById('page1').style.display = 'flex';
                document.getElementById('page2').style.display = 'none';
                document.getElementById('page3').style.display = 'none';

                // Make text uneditable
                elementsToEdit.forEach(id => {
                    const el = document.getElementById(id);
                    el.contentEditable = false;
                    el.classList.remove('editable');
                });

                // Hide image upload input
                imgInput.style.display = 'none';
                
                // Optional: Stop audio if returning to page 1
                document.getElementById('bgm').pause();
                document.getElementById('bgm').currentTime = 0;
            }
        }

        // Image Preview Function
        function previewImage(event) {
            const reader = new FileReader();
            reader.onload = function(){
                const output = document.getElementById('dex-image');
                output.src = reader.result;
            };
            if(event.target.files[0]){
                reader.readAsDataURL(event.target.files[0]);
            }
        }
    </script>
</body>
</html>
